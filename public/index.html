<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#061a24; --bg2:#0c3a48; --bg3:#12556a;
    --tube:#0e2f3d; --tube2:#1a5a72; --tube-hi:#5fd0e6;
    --neon:#7ff3ff; --apple:#ff2f5e; --gold:#ffd166; --text:#eaf7fb; --muted:#9fc6d2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Rajdhani',system-ui,sans-serif;color:var(--text)}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;
    background:radial-gradient(120% 60% at 50% 0%, var(--bg3) 0%, var(--bg2) 35%, var(--bg1) 75%, #03111a 100%);overflow:hidden}
  #stars{position:absolute;inset:0;pointer-events:none}
  .ring{position:absolute;left:50%;top:-140px;width:520px;height:520px;transform:translateX(-50%);border-radius:50%;
    border:6px solid rgba(127,243,255,.55);box-shadow:0 0 40px 8px rgba(127,243,255,.35), inset 0 0 40px rgba(127,243,255,.3);}
  .ring.r2{width:420px;height:420px;top:-90px;border-width:4px;opacity:.7}
  .ring.r3{width:320px;height:320px;top:-40px;border-width:3px;opacity:.5}
  .beam{position:absolute;left:50%;top:0;width:700px;height:900px;transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(50% 100% at 50% 0%, rgba(127,243,255,.25), rgba(127,243,255,0) 70%)}

  /* HUD */
  #hud-top{position:absolute;left:0;right:0;top:40px;padding:0 36px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5}
  .panel{background:rgba(4,20,30,.62);border:1px solid rgba(127,243,255,.25);border-radius:22px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #gifts{padding:18px 22px;min-width:300px}
  #gifts .row{display:flex;align-items:center;gap:14px;padding:7px 0;font-size:30px;font-weight:600}
  #gifts .row .ic{font-size:36px;width:44px;text-align:center}
  #gifts .row .val{margin-left:auto;color:var(--gold);font-family:Orbitron;font-size:24px}
  #stats{padding:18px 26px;min-width:300px}
  #stats .big{font-family:Orbitron;font-size:44px;color:var(--neon);letter-spacing:1px;line-height:1}
  #stats .lbl{font-size:22px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:4px}
  #stats .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin-top:12px}
  #stats .grid b{display:block;font-family:Orbitron;font-size:30px}
  #stats .grid span{font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  #bar{height:10px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:14px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tube-hi),var(--neon));box-shadow:0 0 12px var(--neon)}

  #title{position:absolute;left:0;right:0;top:160px;text-align:center;z-index:4;pointer-events:none}
  #title h1{font-family:Orbitron;font-size:54px;letter-spacing:6px;color:#fff;text-shadow:0 0 24px rgba(127,243,255,.8)}
  #title p{font-size:30px;color:var(--muted);letter-spacing:2px;margin-top:4px}

  /* Board 3D (WebGL) */
  #gl{position:absolute;inset:0;width:1080px;height:1920px;z-index:2}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:6}

  /* Feed */
  #feed{display:none;position:absolute;left:36px;right:36px;bottom:60px;z-index:5;display:flex;flex-direction:column;gap:12px;pointer-events:none}
  .ev{display:flex;align-items:center;gap:16px;padding:12px 20px;font-size:32px;font-weight:600;
    background:rgba(4,20,30,.6);border:1px solid rgba(255,255,255,.08);border-radius:18px;
    animation:evin .35s cubic-bezier(.2,.9,.3,1.2)}
  .ev .av{width:52px;height:52px;border-radius:50%;background:#1f4c4c center/cover;flex:none;border:2px solid rgba(255,255,255,.25)}
  .ev .n{color:var(--gold)}
  .ev .plus{margin-left:auto;font-family:Orbitron;color:var(--apple);font-size:30px;white-space:nowrap}
  .ev.bomb{border-color:rgba(255,122,26,.6);box-shadow:0 0 24px rgba(255,80,0,.25);animation:evin .35s, shake .4s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .ev.like{border-color:rgba(255,80,120,.4)}
  .ev.gift{border-color:rgba(255,209,102,.5);box-shadow:0 0 24px rgba(255,209,102,.15)}
  @keyframes evin{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}

  /* Results */
  #results{position:absolute;left:50%;top:50%;width:900px;transform:translate(-50%,-50%);z-index:20;display:none;
    padding:36px 40px;background:rgba(3,14,22,.92);border:2px solid rgba(127,243,255,.45);border-radius:28px;box-shadow:0 0 80px rgba(127,243,255,.25)}
  #results.show{display:block;animation:resin .4s ease-out}
  @keyframes resin{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%)}}
  #results h2{font-family:Orbitron;font-size:38px;text-align:center;letter-spacing:3px;color:#fff}
  #results .champ{margin:26px auto;padding:18px 26px;display:flex;align-items:center;gap:20px;justify-content:center;
    border:2px solid var(--neon);border-radius:60px;background:rgba(127,243,255,.08);width:680px}
  #results .champ .av{width:84px;height:84px;border-radius:50%;background:#1f4c4c center/cover;border:3px solid var(--gold)}
  #results .champ .t{font-size:20px;letter-spacing:3px;color:var(--neon);text-transform:uppercase}
  #results .champ .n{font-family:Orbitron;font-size:34px}
  #results .champ .v{font-size:26px;color:var(--gold)}
  .sec{margin-top:22px;padding:18px 22px;background:rgba(127,243,255,.05);border:1px solid rgba(127,243,255,.15);border-radius:18px}
  .sec .st{text-align:center;font-size:18px;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
  .sec .sh{text-align:center;font-family:Orbitron;font-size:30px;margin:4px 0 14px}
  .sec .li{display:flex;align-items:center;gap:16px;padding:8px 6px;font-size:28px;border-top:1px solid rgba(255,255,255,.06)}
  .sec .li .pos{font-family:Orbitron;color:var(--neon);width:56px}
  .sec .li .av{width:46px;height:46px;border-radius:50%;background:#1f4c4c center/cover}
  .sec .li .v{margin-left:auto;font-family:Orbitron;color:var(--gold)}
  .sec .li.me{color:var(--muted);font-size:24px;justify-content:center}

  #countdown{position:absolute;left:50%;top:960px;transform:translate(-50%,-50%);z-index:21;display:none;text-align:center}
  #countdown.show{display:block}
  #countdown small{display:block;font-size:34px;letter-spacing:8px;color:var(--muted)}
  #countdown b{font-family:Orbitron;font-size:220px;color:#fff;text-shadow:0 0 40px var(--neon);line-height:1}

  #conn{position:absolute;right:36px;bottom:16px;font-size:20px;color:var(--muted);z-index:5;opacity:.8}
  #conn i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e33;margin-right:8px}
  #conn.on i{background:#3e6}
</style>
</head>

  <canvas id="stars" width="1080" height="1920"></canvas>
  <div class="beam"></div><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>


  <canvas id="gl" width="1080" height="1920"></canvas>

  <div id="feed"></div>

  <div id="results">

    <div class="champ"><div class="av" id="ch-av"></div><div><div class="t">👑 Like champion</div><div class="n" id="ch-n">—</div><div class="v" id="ch-v">0 likes</div></div></div>
    <div class="sec"><div class="st">final ranking</div><div class="sh">TOP SUPPORTERS</div><div id="top-sup"></div></div>

</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js';
// ---------- fit 1080x1920 stage to window ----------
const stage = document.getElementById('stage');
function fit(){ const s=Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit(); setInterval(fit,1000);
if(new URLSearchParams(location.search).get('debug')==='1') document.getElementById('conn').style.display='';

// ---------- stars ----------
(()=>{const c=document.getElementById('stars').getContext('2d');
 for(let i=0;i<260;i++){const x=Math.random()*1080,y=Math.random()*1920,r=Math.random()*1.8+.3;
  c.fillStyle=`rgba(255,255,255,${.3+Math.random()*.7})`;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
})();

// ---------- config ----------
const COLS=14, ROWS=16;                // ROWS must be even
const ROUND_MS = 5*60*1000;           // round length
const RESULTS_MS = 10000;             // results screen
const START_LEN = 3;
const STEP_MS_MIN = 110, STEP_MS_MAX = 220; // speed: more apples on the field = faster
const N = COLS*ROWS;

// Random Hamiltonian cycle: random spanning tree on a (COLS/2 x ROWS/2) coarse grid,
// then walk clockwise around the tree on the fine grid. Different maze every round.
let path=[], idxOf=new Map();
function buildPath(){
  const CW=COLS/2, CH=ROWS/2;
  const edges=new Set(); // "x,y,R" / "x,y,D"
  const seen=new Set(['0,0']); const frontier=[];
  const push=(x,y)=>{ for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(nx>=0&&ny>=0&&nx<CW&&ny<CH&&!seen.has(nx+','+ny)) frontier.push([x,y,nx,ny]); } };
  push(0,0);
  while(frontier.length){ // randomized Prim
    const k=Math.floor(Math.random()*frontier.length); const [x,y,nx,ny]=frontier.splice(k,1)[0];
    if(seen.has(nx+','+ny)) continue; seen.add(nx+','+ny);
    if(nx>x) edges.add(x+','+y+',R'); else if(nx<x) edges.add(nx+','+ny+',R'); else if(ny>y) edges.add(x+','+y+',D'); else edges.add(nx+','+ny+',D');
    push(nx,ny);
  }
  const has=(x,y,d)=>edges.has(x+','+y+','+d);
  const dir=(c,r)=>{ const X=c>>1,Y=r>>1,sx=c&1,sy=r&1;
    if(sx===0&&sy===0) return has(X,Y-1,'D')?[0,-1]:[1,0];      // TL: up if tree edge up, else right
    if(sx===1&&sy===0) return has(X,Y,'R')?[1,0]:[0,1];         // TR: right if edge right, else down
    if(sx===1&&sy===1) return has(X,Y,'D')?[0,1]:[-1,0];        // BR: down if edge down, else left
    return has(X-1,Y,'R')?[-1,0]:[0,-1];                        // BL: left if edge left, else up
  };
  path=[]; let c=0,r=0;
  do{ path.push({c,r}); const [dx,dy]=dir(c,r); c+=dx; r+=dy; } while(!(c===0&&r===0) && path.length<=N);
  if(path.length!==N) return buildPath(); // safety, should not happen
  idxOf=new Map(path.map((p,i)=>[p.c+','+p.r,i]));
}
buildPath();

// ---------- state ----------
const S = {
  round:1, phase:'play', roundStart:performance.now(),
  head:0, len:START_LEN, grow:0, lastStep:0, stepMs:STEP_MS_MAX,
  apples:new Map(),   // idx -> {born, user}
  pending:[],         // {user} apple queue when the board is full
  eaten:0, eatenTotal:0,
  supporters:new Map(), // id -> {id,name,avatar,coins}
  roundLikes:new Map(), // id -> {id,name,avatar,likes}
  particles:[], floats:[], hearts:[], likesTotal:0, likeLog:[], heat:0, likeBank:0, confetti:[], banner:null,
};
const cfg = { applesPerDiamond:1, applesPerFollow:1 };

function occupied(){ const s=new Set(); for(let i=0;i<S.len;i++) s.add((S.head-i+N)%N); return s; }
function freeCells(){ const occ=occupied(); const f=[]; for(let i=0;i<N;i++) if(!occ.has(i)&&!S.apples.has(i)) f.push(i); return f; }
function dropApples(n,user){ for(let i=0;i<n;i++) S.pending.push({user}); }
// Apples spawn on the path ahead of the head, 1-4 seconds of travel away.
const SPAWN_AHEAD_MIN_S=1, SPAWN_AHEAD_MAX_S=4;
const LIKES_PER_APPLE=50;            // every 50 likes drop one apple
const FIRE_START=40, FIRE_MAX=400;   // likes per minute: where the fire starts / is at full blast
function drainPending(){
  if(!S.pending.length) return;
  const occ=occupied(); let dropped=0;
  const minC=Math.max(1,Math.round(SPAWN_AHEAD_MIN_S*1000/S.stepMs)), maxC=Math.min(N-S.len-1,Math.round(SPAWN_AHEAD_MAX_S*1000/S.stepMs));
  const window=[]; for(let d=minC;d<=maxC;d++){ const idx=(S.head+d)%N; if(!occ.has(idx)&&!S.apples.has(idx)) window.push(idx); }
  while(S.pending.length && window.length){
    const k=Math.floor(Math.random()*window.length); const idx=window.splice(k,1)[0];
    S.apples.set(idx,{born:performance.now(),user:S.pending.shift().user}); dropped++;
  }
  // window full: fall back to any free cell further along the path
  if(S.pending.length){
    const free=[]; for(let d=maxC+1;d<N-S.len;d++){ const idx=(S.head+d)%N; if(!occ.has(idx)&&!S.apples.has(idx)) free.push(idx); }
    while(S.pending.length && free.length){ const idx=free.shift(); S.apples.set(idx,{born:performance.now(),user:S.pending.shift().user}); dropped++; }
  }
  if(dropped) sfx.drop();
}

// ---------- images ----------
const imgCache=new Map();
function img(url){ if(!url) return null; let i=imgCache.get(url); if(!i){ i=new Image(); i.crossOrigin='anonymous'; i.src=url; imgCache.set(url,i);} return i.complete&&i.naturalWidth?i:null; }
function topSupporter(){ let best=null; for(const s of S.supporters.values()) if(!best||s.coins>best.coins) best=s; return best; }

// ---------- 3D board rendering (Three.js) ----------
const wx=c=>c-COLS/2+.5, wz=r=>r-ROWS/2+.5;         // grid cell -> world (x on cols, z on rows, y up)
const cx=p=>wx(p.c), cy=p=>wz(p.r);                   // kept for game logic (x, z)
const lerp=(a,b,t)=>a+(b-a)*t;

const gl=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas:gl,antialias:true,alpha:true});
renderer.setSize(1080,1920,false); renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1080/1920,1,1200);
const CAM_POS=new THREE.Vector3(0,37,31), CAM_LOOK=new THREE.Vector3(0,0,1.8);
camera.position.copy(CAM_POS); camera.lookAt(CAM_LOOK);

// lights
scene.add(new THREE.HemisphereLight(0x8fe8ff,0x0a2a22,.55));
const sun=new THREE.DirectionalLight(0xfff4e0,1.5); sun.position.set(8,18,6); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:60}); sun.shadow.bias=-0.0005; sun.shadow.normalBias=.04;
scene.add(sun);
const ringLight=new THREE.PointLight(0x7ff3ff,60,60); ringLight.position.set(0,14,-6); scene.add(ringLight);
const fireLight=new THREE.PointLight(0xff5a00,0,40); fireLight.position.set(0,3,0); scene.add(fireLight);

// platform: rock base + field slab + surface with grid
const rock=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(COLS,ROWS)*.85,Math.max(COLS,ROWS)*.7,2.6,8),new THREE.MeshStandardMaterial({color:0x16393d,roughness:1,flatShading:true}));
rock.position.y=-1.9; rock.receiveShadow=true; scene.add(rock);
const fieldMat=new THREE.MeshStandardMaterial({color:0x1d5350,roughness:.85,emissive:0xff4400,emissiveIntensity:0});
const slab=new THREE.Mesh(new THREE.BoxGeometry(COLS+1.4,.8,ROWS+1.4),fieldMat); slab.position.y=-.4; slab.receiveShadow=true; scene.add(slab);
const gridTex=(()=>{ const c=document.createElement('canvas'); c.width=COLS*64; c.height=ROWS*64; const g=c.getContext('2d');
  g.fillStyle='#1f5a55'; g.fillRect(0,0,c.width,c.height);
  for(let i=0;i<900;i++){ g.fillStyle=`rgba(0,0,0,${Math.random()*.12})`; g.beginPath(); g.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*18,0,7); g.fill(); }
  g.strokeStyle='rgba(180,255,240,.10)'; g.lineWidth=2; for(let i=0;i<=COLS;i++){ g.beginPath(); g.moveTo(i*64,0); g.lineTo(i*64,c.height); g.stroke(); } for(let i=0;i<=ROWS;i++){ g.beginPath(); g.moveTo(0,i*64); g.lineTo(c.width,i*64); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; })();
const surf=new THREE.Mesh(new THREE.PlaneGeometry(COLS,ROWS),new THREE.MeshStandardMaterial({map:gridTex,roughness:.9,emissive:0xff4400,emissiveIntensity:0}));
surf.rotation.x=-Math.PI/2; surf.position.y=0.01; surf.receiveShadow=true; scene.add(surf);
// snake
// ---------- per-round snake skins ----------
const SKINS=[
  {name:'Ocean Python',   base:'#2aa6d8', dark:'#124f78', light:'#9ef0ff', pattern:'diamond', eye:0xffd23f},
  {name:'Jungle Viper',   base:'#3fae4a', dark:'#1d5a23', light:'#c8f07a', pattern:'spots',   eye:0xff9f1a},
  {name:'Coral Snake',    base:'#e8322f', dark:'#141414', light:'#ffd23f', pattern:'rings',   eye:0xffffff},
  {name:'Golden Cobra',   base:'#e5b53a', dark:'#5a3a0a', light:'#fff1a8', pattern:'bands',   eye:0x2ee6a0},
  {name:'Royal Serpent',  base:'#8a4fd8', dark:'#3a1670', light:'#f0b8ff', pattern:'zigzag',  eye:0x7ff3ff},
  {name:'Candy Snake',    base:'#ff6fb5', dark:'#b8236e', light:'#ffffff', pattern:'stripes', eye:0x7ff3ff},
  {name:'Shadow Mamba',   base:'#3b4250', dark:'#12151b', light:'#7ff3ff', pattern:'zigzag',  eye:0xff2f5e},
  {name:'Desert Boa',     base:'#c98a4b', dark:'#5e3417', light:'#f3d3a2', pattern:'diamond', eye:0xffd23f},
];
const skinCanvas=document.createElement('canvas'); skinCanvas.width=256; skinCanvas.height=128;
const skinTex=new THREE.CanvasTexture(skinCanvas); skinTex.colorSpace=THREE.SRGBColorSpace; skinTex.wrapS=skinTex.wrapT=THREE.RepeatWrapping; skinTex.anisotropy=8;
function paintSkin(sk){ const W=256,H=128,g=skinCanvas.getContext('2d');
  g.fillStyle=sk.base; g.fillRect(0,0,W,H);
  const dia=(cx,cy,rx,ry,col)=>{ g.fillStyle=col; g.beginPath(); g.moveTo(cx,cy-ry); g.lineTo(cx+rx,cy); g.lineTo(cx,cy+ry); g.lineTo(cx-rx,cy); g.closePath(); g.fill(); };
  if(sk.pattern==='diamond'){ for(const cy of [H*.25,H*.75]){ dia(W*.5,cy,W*.35,H*.22,sk.dark); dia(W*.5,cy,W*.14,H*.09,sk.light); } }
  else if(sk.pattern==='spots'){ for(const [x,y,r] of [[40,30,22],[150,90,26],[210,25,16],[90,100,14],[250,70,12],[5,80,14]]){ g.fillStyle=sk.dark; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.fillStyle=sk.light; g.beginPath(); g.arc(x,y,r*.45,0,7); g.fill(); } }
  else if(sk.pattern==='rings'){ g.fillStyle=sk.dark; g.fillRect(W*.1,0,W*.3,H); g.fillStyle=sk.light; g.fillRect(W*.4,0,W*.1,H); g.fillRect(0,0,W*.1,H); }
  else if(sk.pattern==='bands'){ g.fillStyle=sk.dark; g.fillRect(W*.15,0,W*.18,H); g.fillRect(W*.62,0,W*.18,H); g.fillStyle=sk.light; g.fillRect(W*.33,0,W*.04,H); g.fillRect(W*.8,0,W*.04,H); }
  else if(sk.pattern==='zigzag'){ g.strokeStyle=sk.dark; g.lineWidth=22; g.lineJoin='miter'; for(const y0 of [H*.25,H*.75]){ g.beginPath(); for(let x=-32;x<=W+32;x+=32) g.lineTo(x,y0+((x/32)%2?-18:18)); g.stroke(); }
    g.strokeStyle=sk.light; g.lineWidth=5; for(const y0 of [H*.25,H*.75]){ g.beginPath(); for(let x=-32;x<=W+32;x+=32) g.lineTo(x,y0+((x/32)%2?-18:18)); g.stroke(); } }
  else if(sk.pattern==='stripes'){ for(let y=0;y<H;y+=32){ g.fillStyle=sk.dark; g.fillRect(0,y,W,12); g.fillStyle=sk.light; g.fillRect(0,y+12,W,4); } }

// ---------- game step ----------
function step(now){
  const next=(S.head+1)%N;
  S.head=next; S.traveled=(S.traveled||0)+1;
  if(S.grow>0){ S.grow--; S.len++; }
  if(S.apples.has(next)){
    const a=S.apples.get(next); S.apples.delete(next); (S.bulges=S.bulges||[]).push({T0:S.traveled}); S.grow++; S.eaten++; S.eatenTotal++;
    spawnBurst(path[next],16,FRUIT.burst,5);
    if(a.user) floatText(`+1 ${a.user.name}`);
    sfx.eat();
  }
  S.lastStep=now;
  // speed scales with pending apples to keep it dynamic
  const load=Math.min(1,(S.apples.size+S.pending.length)/60);
  S.stepMs=(STEP_MS_MAX-(STEP_MS_MAX-STEP_MS_MIN)*load)*(1-.45*S.heat); // on fire = up to ~1.8x faster
  if(S.len>=N-1) endRound();
}

    [1,2,3,4].forEach((n,i)=>fetch(`sounds/bite${n}.mp3`).then(r=>r.arrayBuffer()).then(b=>a.decodeAudioData(b)).then(buf=>bites[i]=buf).catch(()=>{})); }

      const src=a.createBufferSource(); src.buffer=ready[Math.floor(Math.random()*ready.length)]; src.playbackRate.value=.92+Math.random()*.2;

    like: mute,
    follow: safe(()=>{ const a=new Audio('sounds/follow.mp3'); a.volume=.8; a.onended=()=>{ const b=new Audio('sounds/thanks-obama.mp3'); b.volume=.9; b.play().catch(()=>{}); }; a.play().catch(()=>{}); }),
    explode: safe(()=>playDonation()),
    tick: mute,
    go: mute,
    end: mute,
  };
})();
addEventListener('pointerdown',sfx.unlock,{once:true}); addEventListener('keydown',sfx.unlock,{once:true}); sfx.unlock();

const bannerQ=[];
function showBanner(txt,col,avatar){ if(bannerQ.length>=6) bannerQ.shift(); bannerQ.push({txt,col,avatar}); }
function roundRectFx(x,y,w,h,r){ fx.beginPath(); fx.moveTo(x+r,y); fx.arcTo(x+w,y,x+w,y+h,r); fx.arcTo(x+w,y+h,x,y+h,r); fx.arcTo(x,y+h,x,y,r); fx.arcTo(x,y,x+w,y,r); fx.closePath(); }
function burstConfetti(){ const now=performance.now(); const cols=['#7ff3ff','#ffd166','#ff2f5e','#3ddc84','#ffffff'];
  for(let i=0;i<70;i++){ const ang=Math.random()*Math.PI*2, sp=.4+Math.random(); S.confetti.push({t:now,x:540,y:520,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-.8,rot:(Math.random()-.5)*20,col:cols[i%cols.length]}); } }

// ---------- HUD ----------
const $=id=>document.getElementById(id)||{style:{},textContent:'',classList:{add(){},remove(){},toggle(){}}};
function updateHud(now){
  const left=Math.max(0,ROUND_MS-(now-S.roundStart)); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  $('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
  $('s-field').textContent=S.apples.size+(S.pending.length?` +${S.pending.length}`:'');
  $('s-eaten').textContent=S.eaten; $('s-len').textContent=S.len; $('s-likes').textContent=S.likesTotal||0; $('s-likes').style.color=S.heat>0.05?`rgb(255,${Math.round(200-S.heat*150)},60)`:'';
  $('bar-i').style.width=(S.len/N*100).toFixed(1)+'%';
}

// ---------- feed ----------
const feed=$('feed');
function addEvent(cls,avatar,html,plus){
  if(cls==='gift'||cls==='bomb'){ const t=document.createElement('div'); t.innerHTML=html; showBanner(`${t.textContent.trim()}   ${plus||''}`, cls==='bomb'?'#ff7a1a':'#ffd166', avatar); }
  return; // likes, chat and joins are already shown by TikTok itself
  const d=document.createElement('div'); d.className='ev '+cls;
  d.innerHTML=`<div class="av" style="${avatar?`background-image:url('${avatar}')`:''}"></div><div>${html}</div>${plus?`<div class="plus">${plus}</div>`:''}`;
  feed.appendChild(d); while(feed.children.length>5) feed.removeChild(feed.firstChild);
  setTimeout(()=>{ if(d.parentNode) d.remove(); }, 14000);
}

// ---------- events ----------
function onGift(e){
  const u=e.user; const s=S.supporters.get(u.id)||{...u,coins:0}; s.coins+=e.coins; s.name=u.name; if(u.avatar) s.avatar=u.avatar; S.supporters.set(u.id,s);
  const apples=Math.max(1,Math.round(e.coins*cfg.applesPerDiamond));
  dropApples(apples,u);
  sfx.gift(apples>=100);
  addEvent('gift',u.avatar,`<span class="n">${esc(u.name)}</span> 🎁 ${esc(e.giftName)}${e.count>1?' ×'+e.count:''}`,`+${apples} ${FRUIT.emoji}`);
}
function onBomb(e){
  const u=e.user; const s=S.supporters.get(u.id)||{...u,coins:0}; s.coins+=e.coins; s.name=u.name; if(u.avatar) s.avatar=u.avatar; S.supporters.set(u.id,s);
  const cut=Math.min(e.power, Math.max(0,S.len-START_LEN-(S.shrink||0)));
  const now=performance.now(); const tail=(S.head-S.len+1+N)%N;
  S.shrink=(S.shrink||0)+cut; S.grow=0; S.shake=now;
  addEvent('bomb',u.avatar,`<span class="n">${esc(u.name)}</span> 💣 ${esc(e.giftName)}${e.count>1?' ×'+e.count:''} blew up the tail!`,`−${cut} 🐍`);
  sfx.explode();
}
function onFollow(e){ sfx.follow(); burstConfetti(); showBanner(`➕ NEW FOLLOWER · ${e.user.name}`,'#7ff3ff',e.user.avatar); dropApples(cfg.applesPerFollow,e.user); addEvent('follow',e.user.avatar,`<span class="n">${esc(e.user.name)}</span> followed ➕`,`+${cfg.applesPerFollow} ${FRUIT.emoji}`); }
const likeFeedAt=new Map();
function onLike(e){ const u=e.user; const l=S.roundLikes.get(u.id)||{...u,likes:0}; l.likes+=e.likes; S.roundLikes.set(u.id,l); S.likesTotal=(S.likesTotal||0)+e.likes; S.likeLog.push([performance.now(),e.likes]);
  S.likeBank+=e.likes; while(S.likeBank>=LIKES_PER_APPLE){ S.likeBank-=LIKES_PER_APPLE; dropApples(1,u); floatText(`❤ ${LIKES_PER_APPLE} likes = ${FRUIT.emoji}`); }
  const now=performance.now(); for(let i=0;i<Math.min(12,e.likes);i++) S.hearts.push({t:now+i*90,x:900+Math.random()*120,d:.6+Math.random()*.6,s:26+Math.random()*22});
  if(now-(likeFeedAt.get(u.id)||0)>8000){ likeFeedAt.set(u.id,now); addEvent('like',u.avatar,`<span class="n">${esc(u.name)}</span> ❤ liked ×${l.likes}`); }
  sfx.like(); }
function onChat(e){ addEvent('chat',e.user.avatar,`<span class="n">${esc(e.user.name)}</span> ${esc(e.text)}`); }
function onJoin(e){ addEvent('join',e.user.avatar,`<span class="n">${esc(e.user.name)}</span> joined 👋`); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

window.handle=handle;
function handle(msg){
  switch(msg.type){
    case 'snapshot': for(const s of msg.supporters||[]) S.supporters.set(s.id,s); Object.assign(cfg,msg.config||{}); setConn(msg.tiktok); break;
    case 'tiktok': setConn(msg); break;
    case 'gift': onGift(msg); break;
    case 'bomb': onBomb(msg); break;
    case 'follow': onFollow(msg); break;
    case 'like': onLike(msg); break;
    case 'chat': onChat(msg); break;
    case 'join': onJoin(msg); break;
  }
}
function setConn(t){ const c=$('conn'); if(!t) return; c.classList.toggle('on',!!t.connected);
  $('conn-t').textContent = t.connected?`LIVE @${t.username}`:(t.username?`@${t.username}: ${t.error||'connecting…'}`:'demo mode — G gift · B bomb · F follow · L like · K like storm'); }

// ---------- round flow ----------
function endRound(){
  if(S.phase!=='play') return;
  S.phase='results';
  const likes=[...S.roundLikes.values()].sort((a,b)=>b.likes-a.likes);
  const sup=[...S.supporters.values()].sort((a,b)=>b.coins-a.coins);
  const ch=likes[0]; $('ch-n').textContent=ch?ch.name:'—'; $('ch-v').textContent=(ch?ch.likes:0)+' likes';
  $('ch-av').style.backgroundImage=ch&&ch.avatar?`url('${ch.avatar}')`:'';
  $('top-sup').innerHTML=sup.slice(0,5).map((s,i)=>li(i,s,s.coins+' 💎')).join('')||'<div class="li me">no supporters yet 🥺</div>';
  $('top-likes').innerHTML=likes.slice(0,5).map((s,i)=>li(i,s,s.likes+' ❤')).join('')||'<div class="li me">tap like to get here</div>';
  $('results').classList.add('show'); sfx.end();
  const t0=performance.now();
  const iv=setInterval(()=>{ const left=Math.ceil((RESULTS_MS-(performance.now()-t0))/1000); $('rs-t').textContent=Math.max(0,left);
    if(left<=0){ clearInterval(iv); $('results').classList.remove('show'); countdown(); } },200);
}
function li(i,s,v){ return `<div class="li"><span class="pos">#${i+1}</span><div class="av" style="${s.avatar?`background-image:url('${s.avatar}')`:''}"></div><span>${esc(s.name)}</span><span class="v">${v}</span></div>`; }
function countdown(){
  S.phase='countdown'; let n=3; $('cd-n').textContent=n; $('countdown').classList.add('show'); sfx.tick();
  const iv=setInterval(()=>{ n--; if(n<=0){ sfx.go(); clearInterval(iv); $('countdown').classList.remove('show'); resetRound(); } else { $('cd-n').textContent=n; sfx.tick(); } },1000);
}
function resetRound(){
  S.round++; S.len=START_LEN; S.grow=0; S.eaten=0; S.roundLikes.clear(); S.roundStart=performance.now(); S.lastStep=performance.now();
  // new random trajectory; every round starts with an empty board (donated fruit does not carry over)
  buildPath(); S.head=0; S.apples.clear(); S.pending.length=0; S.bulges=[]; S.shrink=0;
  newRoundLook();
  S.phase='play';
}

// ---------- loop ----------
function loop(now){
  if(S.phase==='play'){
    while(now-S.lastStep>=S.stepMs && S.phase==='play') step(S.lastStep+S.stepMs);
    if(now-S.roundStart>=ROUND_MS) endRound();
  }
  // like rate over the last 60s -> heat 0..1 (smoothed)
  const cut=now-60000; while(S.likeLog.length&&S.likeLog[0][0]<cut) S.likeLog.shift();
  const rate=S.likeLog.reduce((a,[,n])=>a+n,0); const target=Math.max(0,Math.min(1,(rate-FIRE_START)/(FIRE_MAX-FIRE_START)));
  S.heat+=(target-S.heat)*0.02; S.likeRate=rate;
  if(false) S.hearts.push({t:now,x:100+Math.random()*880,d:.8,s:30});
  // there is always at least one apple on the board
  if(S.phase==='play'&&S.apples.size===0&&!S.pending.length) dropApples(1,null);
  // bomb: pop tail segments one by one (smooth, no frame spike)
  if(S.shrink>0 && now-(S.lastShrink||0)>30){ S.lastShrink=now;
    if(S.len>START_LEN){ const tail=(S.head-S.len+1+N)%N; spawnBurst(path[tail],6,['#ff7a1a','#ffd166','#ffffff'],7); S.len--; S.shrink--; } else S.shrink=0; }
  if(S.phase==='play') drainPending();
  const _t0=performance.now(); drawBoard(now); const _t1=performance.now(); drawFx(now); const _t2=performance.now(); updateHud(now);
  const P=window.__prof||(window.__prof={n:0,board:0,fx:0,frame:0,last:now}); P.n++; P.board+=_t1-_t0; P.fx+=_t2-_t1; P.frame+=now-P.last; P.last=now;
  if(P.n>=60){ window.__profOut={fps:Math.round(1000/(P.frame/P.n)),boardMs:+(P.board/P.n).toFixed(1),fxMs:+(P.fx/P.n).toFixed(1),calls:renderer.info.render.calls,tris:renderer.info.render.triangles,geos:renderer.info.memory.geometries,tex:renderer.info.memory.textures,apples:S.apples.size,hearts:S.hearts.length,parts:S.particles.length};
    if(document.getElementById('conn').style.display!=='none') document.getElementById('conn-t').textContent=JSON.stringify(window.__profOut); try{ if(window.__ws&&window.__ws.readyState===1) window.__ws.send(JSON.stringify({type:'perf',...window.__profOut,ua:navigator.userAgent.slice(-60),w:innerWidth,h:innerHeight})); }catch(e){}
    P.n=0; P.board=0; P.fx=0; P.frame=0; }
  requestAnimationFrame(loop);
}
SKIN=SKINS[Math.floor(Math.random()*SKINS.length)]; FRUIT=FRUITS.find(f=>f.name===new URLSearchParams(location.search).get('fruit'))||FRUITS[Math.floor(Math.random()*FRUITS.length)]; applyLook();
MAP=MAPS.find(m=>m.name===new URLSearchParams(location.search).get('map'))||MAPS[Math.floor(Math.random()*MAPS.length)]; applyMap();
S.lastStep=performance.now(); requestAnimationFrame(loop);

// ---------- websocket ----------
(function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host); window.__ws=ws;
  ws.onmessage=e=>{ try{ handle(JSON.parse(e.data)); }catch(err){ console.error(err); } };
  ws.onclose=()=>setTimeout(connect,2000);
})();

// ---------- demo / keyboard ----------
const NAMES=['Zosky','Lisa','Champi-Bot','nosewxd','Marco','Manuel_le','shawnnysideup','Bernaard01'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function fakeUser(){ const n=rnd(NAMES); return {id:n.toLowerCase(),name:n,avatar:`https://api.dicebear.com/9.x/thumbs/png?seed=${n}&size=96`}; }
function fakeGift(){ const g=rnd([['Rose',1],['Rose',1],['Rose',1],['Finger Heart',5],['Donut',30],['Hand Hearts',100],['Hand Hearts',100],['Hand Hearts',100],['Galaxy',1000]]); const count=g[1]===1?1+Math.floor(Math.random()*9):1;
  handle({type:'gift',user:fakeUser(),giftName:g[0],diamonds:g[1],count,coins:g[1]*count}); }
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='g') fakeGift(); else if(k==='f') handle({type:'follow',user:fakeUser()}); else if(k==='l') handle({type:'like',user:fakeUser(),likes:1+Math.floor(Math.random()*20)});
  else if(k==='c') handle({type:'chat',user:fakeUser(),text:rnd(['wow','HAH','OMG','🔥🔥🔥','more!'])}); else if(k==='k'){ for(let i=0;i<10;i++) handle({type:'like',user:fakeUser(),likes:15+Math.floor(Math.random()*15)}); } else if(k==='b') handle({type:'bomb',user:fakeUser(),giftName:'GG',diamonds:1,count:1+Math.floor(Math.random()*20),coins:1,power:1+Math.floor(Math.random()*20)}); else if(k==='e') endRound(); });
if(new URLSearchParams(location.search).get('demo')==='1'){
  (function tick(){ const r=Math.random(); if(r<.3) fakeGift(); else if(r<.36) handle({type:'bomb',user:fakeUser(),giftName:'GG',diamonds:1,count:5,coins:5,power:5}); else if(r<.5) handle({type:'follow',user:fakeUser()}); else if(r<.85) handle({type:'like',user:fakeUser(),likes:1+Math.floor(Math.random()*20)}); else handle({type:'chat',user:fakeUser(),text:rnd(['wow','HAH','OMG','🔥'])});
    setTimeout(tick,600+Math.random()*2500); })();
}
